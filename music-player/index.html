<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music OST · Lyrics đồng bộ</title><style>
 body{margin:0;padding:18px;background:#f4f6fb;font-family:system-ui,Arial;color:#1c2540}.wrap{max-width:1000px;margin:auto}.panel,.cue{background:white;border:1px solid #d9e1f1;border-radius:16px;padding:16px;margin:12px 0}audio{width:100%}.muted{font-size:13px;color:#667085}.cue{border-left:5px solid #7c3aed}.cue.active{background:#faf5ff;border-color:#b794f6}button{background:#7136ed;color:white;border:0;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:700}.volume{display:flex;align-items:center;gap:10px}.volume input{flex:1}.lyrics{white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}.lyric-scroll{height:330px;overflow-y:auto;scroll-behavior:smooth;border:1px solid #e6d9ff;border-radius:12px;background:#fcfaff;padding:12px}.lyric-line{padding:11px 13px;border-radius:10px;margin:5px 0;transition:background .2s,color .2s;font-size:18px}.lyric-line.past{color:#98a2b3}.lyric-line.now{background:#7136ed;color:#fff;font-weight:800;box-shadow:0 3px 12px #7136ed33}.lyric-line.future{color:#344054}.fallback{font-size:14px}.track{padding:8px;background:#f1f5fa;margin:5px 0;border-radius:7px}h1{font-size:24px}details{margin-top:12px}summary{cursor:pointer;font-weight:700;color:#7136ed}
 </style></head><body><main class="wrap"><section class="panel"><h1>🎵 Music / OST · <span id="title"></span></h1><p class="muted">Lyrics SRT tự tô sáng và cuộn theo thời gian nhạc. Có thể kéo thanh thời gian để chuyển câu.</p><audio id="player" controls preload="metadata"></audio><label class="volume">Âm lượng OST <input type="range" id="vol" min="0" max="100" value="70"><span id="volText">70%</span></label><p class="muted">Nếu nhạc GitHub chưa tải được: <input id="file" type="file" accept="audio/*"></p><div id="status" class="muted"></div><div id="tracks"></div></section><div id="list"></div></main><script>
 const project={"version":"MUSIC_OST_PROJECT_V2","tracks":[{"id":"ost1","title":"OST 1","file":""}],"title":"Agency S01E10","movie":"Agency","episode":"S01E10","githubSlug":"agency_s01e10","musicFolder":"../music","musicTracks":[{"id":"ost1","title":"OST 1","file":""}],"musicAudioFile":"","cues":[],"exportedAt":"2026-11-25T16:00:07.372Z"}, $=id=>document.getElementById(id), audio=$('player'), tracks=project.tracks||project.musicTracks||[], cues=project.cues||[];
 const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const norm=x=>String(x||'').replaceAll('\\','/').replace(/^\/+|\/+$/g,'');
 let active=-1,trackId='',stopAt=null,localUrl=null;
 function trackFor(m){return tracks.find(t=>t.id===m.trackId)||tracks[0]||{};}
 function setTrack(m){const t=trackFor(m),id=t.id||'default';if(trackId===id)return;trackId=id;if(localUrl)return;const file=norm(t.file||project.musicAudioFile),folder=norm(project.musicFolder||'music');if(!file)return;const paths=/^https?:\/\//i.test(file)?[file]:['../'+folder+'/'+file,'../music/'+file,'music/'+file,file];let k=0;audio.onerror=()=>{if(++k<paths.length){audio.src=encodeURI(paths[k]);audio.load();}else $('status').textContent='Không tìm thấy MP3 trên GitHub. Hãy chọn file thủ công.';};audio.src=encodeURI(paths[0]);audio.load();}
 function timed(m){return (Array.isArray(m.timedLyrics)?m.timedLyrics:[]).filter(x=>Number.isFinite(+x.start)&&Number.isFinite(+x.end)&&x.text).sort((a,b)=>a.start-b.start);}
 function linesHtml(m,i){const lines=timed(m);if(!lines.length)return '<div class="fallback muted">Chưa có timecode SRT. Hãy nhập SRT trong Workspace rồi Export ALL lại.</div>';
 return '<div class="lyric-scroll" id="scroll'+i+'">'+lines.map((l,j)=>'<div class="lyric-line future" id="line'+i+'_'+j+'" data-start="'+Number(l.start)+'" data-end="'+Number(l.end)+'">'+esc(l.text)+'</div>').join('')+'</div>';}
 $('title').textContent=project.title||project.movie||'Music';audio.volume=.7;$('vol').oninput=e=>{audio.volume=+e.target.value/100;$('volText').textContent=e.target.value+'%';};
 $('tracks').innerHTML=tracks.map(t=>'<div class="track">🎼 '+esc(t.title||t.file||'OST')+'</div>').join('');
 $('list').innerHTML=cues.map((c,i)=>{const m=c.music||{},t=trackFor(m);return '<section class="cue" id="cue'+i+'"><b>Cue #'+esc(c.no)+' · 🎵 '+esc(m.title||t.title||'OST')+'</b><div class="muted">'+Number(m.start||0).toFixed(2)+'s → '+Number(m.end||0).toFixed(2)+'s</div><p><button onclick="playOST('+i+')">▶ Play OST + Lyrics</button></p>'+linesHtml(m,i)+'<details><summary>📜 Xem toàn bộ Lyrics KO / VI / EN</summary>'+['ko','vi','en'].filter(k=>m[k]).map(k=>'<p><b>'+k.toUpperCase()+'</b></p><div class="lyrics">'+esc(m[k])+'</div>').join('')+'</details></section>';}).join('')||'<p>Chưa có cue OST.</p>';
 function sync(){if(active<0)return;const m=cues[active]?.music||{},arr=timed(m),now=audio.currentTime;let ix=-1;for(let j=0;j<arr.length;j++){if(now>=+arr[j].start&&now<+arr[j].end){ix=j;break;}if(now>=+arr[j].start)ix=j;}
 arr.forEach((l,j)=>{const el=$('line'+active+'_'+j);if(el)el.className='lyric-line '+(j===ix?'now':j<ix?'past':'future');});if(ix>=0){const line=$('line'+active+'_'+ix),box=$('scroll'+active);if(line&&box&&box.dataset.current!==String(ix)){box.dataset.current=String(ix);box.scrollTo({top:line.offsetTop-box.offsetTop-box.clientHeight/2+line.clientHeight/2,behavior:'smooth'});}}}
 window.playOST=function(i){const c=cues[i];if(!c)return;active=i;const m=c.music||{};setTrack(m);stopAt=Number(m.end);document.querySelectorAll('.cue').forEach((x,j)=>x.classList.toggle('active',j===i));const go=()=>{audio.currentTime=Number(m.start)||0;audio.play().catch(()=>{$('status').textContent='Không phát được MP3. Kiểm tra file nhạc.';});sync();};if(audio.readyState>=1)go();else audio.addEventListener('loadedmetadata',go,{once:true});};
 audio.addEventListener('timeupdate',()=>{sync();if(stopAt!=null&&audio.currentTime>=stopAt){audio.pause();stopAt=null;}});audio.addEventListener('seeked',sync);
 $('file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(localUrl)URL.revokeObjectURL(localUrl);localUrl=URL.createObjectURL(f);audio.onerror=null;audio.src=localUrl;audio.load();$('status').textContent='Đã chọn: '+f.name;};
 </script></body></html>
